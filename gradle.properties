# --- PluginFence build configuration -------------------------------------------------
pluginFenceVersion = 0.1.0

# IntelliJ Platform target (unified IntelliJ IDEA distribution, 2025.3+ product line)
platformVersion = 2026.2.3
pluginSinceBuild = 262
pluginUntilBuild = 262.*

# Java level required by IntelliJ Platform 2026.2 (see build-number-ranges docs)
javaToolchainVersion = 25

# Kotlin: the platform bundles kotlin-stdlib, so the plugin must not ship its own copy.
kotlin.stdlib.default.dependency = false
kotlin.code.style = official

# Gradle
org.gradle.jvmargs = -Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching = true
org.gradle.parallel = true
org.gradle.configuration-cache = false

# IntelliJ Platform Gradle Plugin: keep the downloaded IDE out of the Gradle cache and re-usable.
org.jetbrains.intellij.platform.buildFeature.selfUpdateCheck = false
